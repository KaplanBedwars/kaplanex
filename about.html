<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakkında</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            width: 100%;
        }
        h2 {
            color: #333;
        }
        button {
            padding: 10px 15px;
            margin-top: 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Electron Tarayıcı</h2>
        <p>Versiyon: 1.0.0</p>
        <p>Bu bir basit Electron web tarayıcısıdır.</p>
        <button onclick="closeWindow()">Kapat</button>
    </div>

    <script>
        function closeWindow() {
            window.electronAPI.closeWindow();
        }
    </script>
</body>
</html>
