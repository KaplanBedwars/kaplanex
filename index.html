<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaplanex Tarayıcı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --toolbar-bg: rgba(255, 255, 255, 0.8);
            --toolbar-border: #ddd;
            --input-bg: #ececec;
            --input-text: #000;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #ffffff;
                --toolbar-bg: rgba(25, 25, 25, 0.8);
                --toolbar-border: #333;
                --input-bg: #222;
                --input-text: #fff;
                --shadow-color: rgba(255, 255, 255, 0.1);
            }
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }
        #toolbar {
            display: flex;
            align-items: center;
            padding: 6px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--toolbar-border);
            gap: 6px;
            box-shadow: 0 2px 5px var(--shadow-color);
            backdrop-filter: blur(10px);
        }
        .toolbar-btn {
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s ease;
            border-radius: 50%;
            color: var(--text-color);
        }
        .toolbar-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        #url-bar {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: none;
            border-radius: 20px;
            outline: none;
            text-align: center;
            background: var(--input-bg);
            color: var(--input-text);
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 3px var(--shadow-color);
        }
        #url-bar:focus {
            background: var(--bg-color);
            box-shadow: 0 0 5px var(--shadow-color);
        }
        #web-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        webview {
            flex: 1;
            border: none;
        }
        #kaplanex-home {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background-color: var(--bg-color);
            text-align: center;
        }
        .kaplanex-logo {
            font-size: 50px;
            font-weight: bold;
            color: #4285F4;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            align-items: center;
            width: 450px;
            background: var(--input-bg);
            border-radius: 20px;
            box-shadow: 0 2px 5px var(--shadow-color);
            padding: 4px 8px;
        }
        #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: #4285F4;
    transition: width 0.2s ease-in-out;
}

        .search-box input {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 14px;
            border-radius: 20px;
            outline: none;
            background: var(--input-bg);
            color: var(--input-text);
        }
        .search-box button {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 20px;
            background-color: #4285F4;
            color: white;
            cursor: pointer;
        }
        .search-box button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="back" class="toolbar-btn">⯇</button>
        <button id="forward" class="toolbar-btn">⯈</button>
        <button id="reload" class="toolbar-btn">⟳</button>
        <input type="text" id="url-bar" placeholder="Arama yap veya URL girin">
        <div id="progress-bar"></div>

    </div>
    <div id="web-container">
        <div id="kaplanex-home">
            <div class="kaplanex-logo">Kaplanex</div>
            <div class="search-box">
                <input type="text" id="search" placeholder="Kaplanex'te ara...">
                <button onclick="performSearch()">Ara</button>
            </div>
        </div>
        <webview id="webview" src="about:blank"></webview>
    </div>

    <script src="test.js"></script>
</body>
</html>
